name: Release

on:
  push:
    tags:
      - "v*"
      - "vscode-v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-npm:
    name: Verify and publish npm artifact
    if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'vscode-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - name: Validate tag and package identity
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Verify source and build once
        run: pnpm check:release
      - name: Pack the verified build without rebuilding
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --json --pack-destination artifacts > artifacts/pack.json
          (cd artifacts && sha256sum *.tgz > SHA256SUMS)
      - name: Smoke the installed artifact
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          TASK_CONSUMER=$(mktemp -d)
          printf '{"private":true}' > "$TASK_CONSUMER/package.json"
          npm install --prefix "$TASK_CONSUMER" --ignore-scripts --no-audit --no-fund "$PWD"/artifacts/*.tgz
          node scripts/smoke-package.mjs "$TASK_CONSUMER" "$EXPECTED_VERSION"
      - name: Preserve candidate before publication
        uses: actions/upload-artifact@v4
        with:
          name: npm-candidate-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
      - name: Publish the exact verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ steps.metadata.outputs.channel }}
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          node scripts/publish-npm.mjs artifacts "$RELEASE_CHANNEL"
      - name: Verify registry artifact and installation
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          npm view "@corbat-tech/coco@$EXPECTED_VERSION" dist.integrity > artifacts/registry-integrity.txt
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const packed=JSON.parse(fs.readFileSync("artifacts/pack.json"))[0]; assert.equal(fs.readFileSync("artifacts/registry-integrity.txt","utf8").trim(),packed.integrity);'
          TASK_CONSUMER=$(mktemp -d)
          printf '{"private":true}' > "$TASK_CONSUMER/package.json"
          npm install --prefix "$TASK_CONSUMER" --ignore-scripts --no-audit --no-fund "@corbat-tech/coco@$EXPECTED_VERSION"
          node scripts/smoke-package.mjs "$TASK_CONSUMER" "$EXPECTED_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          overwrite: true
          path: artifacts/*
          if-no-files-found: error

  release-vscode:
    name: Verify and publish VSIX artifact
    if: startsWith(github.ref_name, 'vscode-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate extension tag and identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"
      - run: pnpm --dir vscode-extension install --ignore-workspace --frozen-lockfile
      - name: Typecheck and build extension
        working-directory: vscode-extension
        run: |
          pnpm exec tsc --noEmit
          pnpm build
      - name: Package and verify VSIX contents
        working-directory: vscode-extension
        run: |
          mkdir -p ../artifacts
          pnpm exec vsce package --no-dependencies --out ../artifacts/corbat-coco.vsix
          unzip -t ../artifacts/corbat-coco.vsix
          unzip -p ../artifacts/corbat-coco.vsix extension/dist/extension.js > ../artifacts/extension-smoke.js
          test -s ../artifacts/extension-smoke.js
          node --check ../artifacts/extension-smoke.js
          rm ../artifacts/extension-smoke.js
          (cd ../artifacts && sha256sum *.vsix > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          overwrite: true
          path: artifacts/*
          if-no-files-found: error
      - name: Block VSIX publication until its operational gate is complete
        run: |
          echo "::error::VSIX publication requires E11 extension-host smoke and registry reconciliation. No Marketplace publication attempted."
          exit 1

  github-release:
    name: Create release only after successful channel publication
    runs-on: ubuntu-latest
    needs: [release-npm, release-vscode]
    if: >-
      always() && !cancelled() &&
      ((needs.release-npm.result == 'success' && needs.release-vscode.result == 'skipped') ||
      (needs.release-vscode.result == 'success' && needs.release-npm.result == 'skipped'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts/
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'vscode-v') && contains(github.ref_name, '-') }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
