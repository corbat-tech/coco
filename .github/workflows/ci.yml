name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format

      - name: Type check
        run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.23.4", "24.22.1", "26.12.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  repl:
    name: REPL integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run REPL integration
        run: pnpm test:repl

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck workspace applications
        run: pnpm -r --filter './apps/*' --if-present typecheck

      - name: Verify CLI
        run: |
          node dist/cli/index.js --version
          node dist/cli/index.js --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  portability:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Platform contracts
        run: pnpm exec vitest run src/utils/platform.test.ts src/runtime/platform.test.ts
      - run: pnpm build
      - name: Install and smoke the packed artifact in isolation
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --json --pack-destination artifacts > artifacts/pack.json
          TASK_CONSUMER=$(mktemp -d)
          printf '{"private":true}' > "$TASK_CONSUMER/package.json"
          npm install --prefix "$TASK_CONSUMER" --ignore-scripts --no-audit --no-fund "$PWD"/artifacts/*.tgz
          TASK_VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          node scripts/smoke-package.mjs "$TASK_CONSUMER" "$TASK_VERSION"

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          cache-dependency-path: vscode-extension/pnpm-lock.yaml
      - run: pnpm --dir vscode-extension install --frozen-lockfile
      - run: pnpm --dir vscode-extension typecheck
      - run: pnpm --dir vscode-extension test:contract
      - run: xvfb-run -a pnpm --dir vscode-extension test:host
      - name: Package extension
        working-directory: vscode-extension
        run: pnpm exec vsce package --no-dependencies --out /tmp/corbat-coco.vsix
