packages:
  - "apps/*"
  - "packages/*"

# Native build steps needed by the compiler and bundler, explicitly reviewed.
allowBuilds:
  "@google/genai": true # Published preinstall is a no-op.
  esbuild: true
  protobufjs: true # Checks the dependency version scheme; no compilation/download.
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@aws-sdk/client-bedrock-runtime@3.1158.0"
  - "@aws-sdk/credential-providers@3.1158.0"
  - "@aws-sdk/token-providers@3.1158.0"
  - "@isaacs/nonrecursive-glob-match@1.0.2"
  - glob@14.0.3
  - minimatch@11.0.2
  - openai@7.45.1
  - path-scurry@3.0.0
